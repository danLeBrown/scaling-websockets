<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js" integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz" crossorigin="anonymous"></script>
    <!-- HTMX WebSocket Extension -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/ext/ws.js"></script>
    <style>
        /* Custom scrollbar styling */
        .message-container::-webkit-scrollbar {
            width: 6px;
        }
        .message-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .message-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }
        .message-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto max-w-4xl px-4 py-8">
        <!-- Header -->
        <div class="bg-white rounded-t-lg shadow-lg p-4 border-b border-gray-200">
            <div class="flex items-center justify-between">
                <h1 class="text-2xl font-bold text-gray-800">WebSocket Chat</h1>
                <div class="flex items-center gap-2">
                    <div id="connection-status" class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-gray-400 animate-pulse" id="status-indicator"></span>
                        <span class="text-sm text-gray-600" id="status-text">Connecting...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Username Section -->
        <div id="username-section" class="bg-white px-4 py-3 border-b border-gray-200">
            <div class="flex items-center gap-2">
                <label for="username-input" class="text-sm font-medium text-gray-700">Username:</label>
                <input 
                    type="text" 
                    id="username-input" 
                    placeholder="Enter your username" 
                    class="flex-1 px-3 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
                    maxlength="20"
                />
                <button 
                    id="set-username-btn"
                    class="px-4 py-1.5 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 text-sm font-medium transition-colors"
                >
                    Set
                </button>
            </div>
            <div id="current-username" class="mt-2 text-sm text-gray-600 hidden">
                <span>Chatting as: <strong id="username-display"></strong></span>
            </div>
        </div>

        <!-- Message Container -->
        <div 
            id="messages-container" 
            class="message-container bg-white h-96 overflow-y-auto p-4 space-y-3"
            hx-ext="ws"
            ws-connect="/ws"
            ws-send
        >
            <!-- Messages will be inserted here via HTMX -->
            <div id="messages-list" class="space-y-3">
                <!-- Welcome message -->
                <div class="text-center text-gray-500 text-sm py-4">
                    <p>Welcome to the chat! Set your username and start messaging.</p>
                </div>
            </div>
        </div>

        <!-- Message Input Form -->
        <div class="bg-white rounded-b-lg shadow-lg p-4 border-t border-gray-200">
            <form 
                id="message-form"
                ws-send
                class="flex gap-2"
                onsubmit="return false;"
            >
                <input 
                    type="text" 
                    id="message-input" 
                    name="message"
                    placeholder="Type your message..." 
                    class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    disabled
                    autocomplete="off"
                />
                <button 
                    type="submit"
                    id="send-btn"
                    class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 font-medium transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed"
                    disabled
                >
                    Send
                </button>
            </form>
        </div>
    </div>

    <!-- Message Template (hidden, used by HTMX) -->
    <template id="message-template">
        <div class="message-item flex flex-col gap-1" data-username="">
            <div class="flex items-baseline gap-2">
                <span class="username-badge font-semibold text-sm"></span>
                <span class="timestamp text-xs text-gray-500"></span>
            </div>
            <div class="message-content text-gray-800 break-words"></div>
        </div>
    </template>

    <script>
        // Username management
        const usernameInput = document.getElementById('username-input');
        const setUsernameBtn = document.getElementById('set-username-btn');
        const usernameDisplay = document.getElementById('username-display');
        const currentUsernameDiv = document.getElementById('current-username');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const messagesList = document.getElementById('messages-list');
        const messagesContainer = document.getElementById('messages-container');
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');

        // Load username from localStorage
        let currentUsername = localStorage.getItem('chat-username') || '';
        if (currentUsername) {
            usernameInput.value = currentUsername;
            usernameDisplay.textContent = currentUsername;
            currentUsernameDiv.classList.remove('hidden');
            enableMessaging();
        }

        // Set username handler
        setUsernameBtn.addEventListener('click', setUsername);
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                setUsername();
            }
        });

        function setUsername() {
            const username = usernameInput.value.trim();
            if (username.length < 1) {
                alert('Please enter a username');
                return;
            }
            if (username.length > 20) {
                alert('Username must be 20 characters or less');
                return;
            }
            currentUsername = username;
            localStorage.setItem('chat-username', username);
            usernameDisplay.textContent = username;
            currentUsernameDiv.classList.remove('hidden');
            enableMessaging();
        }

        function enableMessaging() {
            messageInput.disabled = false;
            sendBtn.disabled = false;
            messageInput.focus();
        }

        // WebSocket message handling
        document.body.addEventListener('htmx:wsAfterMessage', function(event) {
            console.log('htmx:wsAfterMessage', event);
            const data = event.detail.message;
            let messageData;
            
            try {
                // Try to parse as JSON
                messageData = typeof data === 'string' ? JSON.parse(data) : data;
            } catch (e) {
                // If not JSON, treat as plain text
                messageData = {
                    username: 'Unknown',
                    message: data,
                    timestamp: new Date().toISOString()
                };
            }

            // Ensure we have required fields
            if (!messageData.username) messageData.username = 'Unknown';
            if (!messageData.message) messageData.message = data;
            if (!messageData.timestamp) messageData.timestamp = new Date().toISOString();

            addMessageToUI(messageData);
        });

        // Add message to UI
        function addMessageToUI(messageData) {
            // Remove welcome message if present
            const welcomeMsg = messagesList.querySelector('.text-center');
            if (welcomeMsg) {
                welcomeMsg.remove();
            }

            const template = document.getElementById('message-template');
            const messageElement = template.content.cloneNode(true);
            
            const messageItem = messageElement.querySelector('.message-item');
            const usernameBadge = messageElement.querySelector('.username-badge');
            const timestampSpan = messageElement.querySelector('.timestamp');
            const messageContent = messageElement.querySelector('.message-content');

            // Check if message is from current user
            const isOwnMessage = messageData.username === currentUsername;
            
            if (isOwnMessage) {
                messageItem.classList.add('items-end');
                messageItem.classList.add('ml-auto');
                messageItem.classList.add('max-w-[80%]');
                usernameBadge.classList.add('text-blue-600');
                messageContent.classList.add('bg-blue-100', 'px-3', 'py-2', 'rounded-lg', 'rounded-tr-none');
            } else {
                messageItem.classList.add('items-start');
                messageItem.classList.add('max-w-[80%]');
                usernameBadge.classList.add('text-indigo-600');
                messageContent.classList.add('bg-gray-100', 'px-3', 'py-2', 'rounded-lg', 'rounded-tl-none');
            }

            usernameBadge.textContent = messageData.username;
            timestampSpan.textContent = formatTimestamp(messageData.timestamp);
            messageContent.textContent = messageData.message;
            messageItem.setAttribute('data-username', messageData.username);

            messagesList.appendChild(messageElement);
            scrollToBottom();
        }

        // Format timestamp
        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);

            if (diffMins < 1) {
                return 'just now';
            } else if (diffMins < 60) {
                return `${diffMins}m ago`;
            } else if (diffHours < 24) {
                return `${diffHours}h ago`;
            } else if (diffDays < 7) {
                return `${diffDays}d ago`;
            } else {
                return date.toLocaleDateString();
            }
        }

        // Auto-scroll to bottom
        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Send message handler
        const messageForm = document.getElementById('message-form');
        messageForm.addEventListener('submit', function(e) {
            e.preventDefault();
            sendMessage();
        });

        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;
            if (!currentUsername) {
                alert('Please set your username first');
                return;
            }

            // Create message object
            const messageData = {
                username: currentUsername,
                message: message,
                timestamp: new Date().toISOString()
            };

            // Send via WebSocket using HTMX
            const wsSendEvent = new CustomEvent('htmx:wsSend', {
                detail: {
                    message: JSON.stringify(messageData)
                }
            });
            document.body.dispatchEvent(wsSendEvent);

            // Clear input
            messageInput.value = '';
            messageInput.focus();
        }

        // Connection status handling
        document.body.addEventListener('htmx:wsOpen', function() {
            statusIndicator.classList.remove('bg-gray-400', 'bg-red-500');
            statusIndicator.classList.add('bg-green-500');
            statusIndicator.classList.remove('animate-pulse');
            statusText.textContent = 'Connected';
        });

        document.body.addEventListener('htmx:wsClose', function() {
            statusIndicator.classList.remove('bg-green-500', 'bg-gray-400');
            statusIndicator.classList.add('bg-red-500');
            statusIndicator.classList.add('animate-pulse');
            statusText.textContent = 'Disconnected';
        });

        document.body.addEventListener('htmx:wsError', function() {
            statusIndicator.classList.remove('bg-green-500', 'bg-gray-400');
            statusIndicator.classList.add('bg-red-500');
            statusIndicator.classList.add('animate-pulse');
            statusText.textContent = 'Connection Error';
        });

        // Initialize focus
        if (currentUsername) {
            messageInput.focus();
        } else {
            usernameInput.focus();
        }
    </script>
</body>
</html>
